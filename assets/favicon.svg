<svg width="200px" height="200px" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <clipPath id="circle-clip">
        <rect x="0" y="0" width="100" height="50"/>
    </clipPath>

    <style>
    .color-1 {
        fill: black;
    }
    .color-2 {
        fill: white;
    }</style>

    <circle cx="50" cy="50" r="50" class="color-1" />
    <circle cx="50" cy="50" r="50" class="color-2" clip-path="url(#circle-clip)" />

    <g transform="translate(12.5, 25)">
        <circle cx="10" cy="10" r="10" class="color-1" />
        <path d="M35 0 L45 20 L25 20 Z" class="color-1" />
        <rect x="55" y="0" width="20" height="20" class="color-1" />
    </g>

    <g transform="translate(12.5, 55)">
        <circle cx="10" cy="10" r="10" class="color-2" />
        <path d="M35 0 L45 20 L25 20 Z" class="color-2" />
        <rect x="55" y="0" width="20" height="20" class="color-2" />
    </g>
</svg>